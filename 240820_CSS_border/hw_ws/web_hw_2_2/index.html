<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .outline {
      border: 1px solid black;
    }
    
    /* 아직 미완성 */
    .name {
      background-color: orange;
      font-size: 30px;
      text-align: center;
      font-weight: bold;
      padding-top: 15px;
      padding-bottom: 15px;
      height: 50px;
      margin-left: 15px;
      margin-right: 15px;
    }

    .sizing {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="outline">
    <div>
      <img class="sizing" src="profile.jpg" alt="Profile Image">
    </div>
    <p class="name">Name</p> 
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci unde officiis ad nostrum. Laboriosam mollitia similique provident fuga tenetur saepe sit, amet eaque neque eius quaerat expedita ea illum veniam.</p>
  </div>
</body>
</html>

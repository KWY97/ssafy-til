<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* div 요소 하위단계에 있는 모든 p에 대해 */
    div p {
      color: blue;
    }

    /* div 요소의 하위의 첫 단계 중 p가 있을 때 */
    div > p {
      color: crimson;
    }

    .txt-size {
      font-size: 40px;
    }

    .descendant-pos {
      padding-left: 100px;
    }
    
  </style>
</head>
<body>
  <div class="txt-size">
    <p>자식</p>
    <article>
      <p class="descendant-pos">손자</p>
    </article>
    <p>자식</p>
  </div>
</body>
</html>

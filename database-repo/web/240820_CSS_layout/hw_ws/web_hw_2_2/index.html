<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .card {
      border: 2px solid black;
      width: 400px;
      height: 500px;
      padding: 10px;
    }

    .card-header {
      position: relative;
      text-align: center;
    }

    .card-name {
      background-color: rgba(255, 166, 0, 0.425);
      height: 50px;
      line-height: 50px;
      font-size: 30px;
      font-weight: bold;
      position: absolute;
      width: 100%;
      margin: 0px;
      bottom: 4.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <img src="profile.jpg" alt="">
      <p class="card-name">Name</p>
    </div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci unde officiis ad nostrum. Laboriosam mollitia similique provident fuga tenetur saepe sit, amet eaque neque eius quaerat expedita ea illum veniam.</p>
  </div>
</body>
</html>
